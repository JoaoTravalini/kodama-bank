name: Testes

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-secret-used-only-for-automated-tests-123456
      SERVER_LOCALHOST: 127.0.0.1
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependências dos testes
        run: python -m pip install -r requirements-dev.txt

      - name: Subir banco e API do zero
        run: docker compose up -d --build db api

      - name: Esperar a API ficar pronta
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/health_check > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color db api
          exit 1

      - name: Rodar testes
        run: python -m pytest -q tests/integration tests/unit

      - name: Iniciar worker
        run: docker compose up -d --build worker

      - name: Testar transferencia completa por HTTP
        run: python -m pytest -q tests/e2e/test_transfer_worker.py

      - name: Mostrar logs se houver falha
        if: failure()
        run: docker compose logs --no-color db api

      - name: Encerrar contêineres
        if: always()
        run: docker compose down -v